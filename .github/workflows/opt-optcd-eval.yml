name: Modified Java CI
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
env:
  MAVEN_VERSION: 3.9.16
jobs:
  build:
    runs-on:
      - self-hosted
      - optcd
    steps:
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |-
          python -m pip install --upgrade pip
          pip install inotify
      - name: Run inotifywait
        run: |-
          python3 -c "
          import inotify.adapters
          import inotify.constants
          import os
          from datetime import datetime, timezone
          with open('/home/runner/inotifywait-log-build.csv', 'w') as log_file:
            i = inotify.adapters.InotifyTree('/home/runner/work/redisson/redisson', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
            for event in i.event_gen(yield_nones=False):
              (_, type_names, path, filename) = event
              now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
              events = ','.join(type_names)
              log_file.write(f'{now};{path};{filename};{events}\n')
              log_file.flush()
              os.fsync(log_file.fileno())
          " &
      - uses: actions/checkout@v6
      - run: touch optcd-3.txt
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - run: touch optcd-4.txt
      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        run: |-
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: touch optcd-5.txt
      - name: Build with Maven
        run: "mvn -v\nmvn -T 1C -B clean verify -DskipTests -Dmaven.test.skip=false
          --file pom.xml\n -Denforcer.skip=true -Dmaven.compiler.testSkip=true -Dmaven.compiler.useIncrementalCompilation=false
          -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -vmvn"
      - run: touch optcd-6.txt
      - name: Upload inotifywait logs
        uses: actions/upload-artifact@v4
        with:
          name: inotifywait-build
          path: /home/runner/inotifywait-log-build.csv
    name: build
'on':
  - push
  - workflow_dispatch
